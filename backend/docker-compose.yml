services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PW:-ssafy}
      MYSQL_DATABASE: ozz
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - spring-cloud-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - spring-cloud-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - spring-cloud-network
      - message-queue-network

  ozz-backend:
    container_name: ozz-backend
    build: ./monolith
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      BACKEND_PORT: 8000
      DB_URL: jdbc:mysql://mysql-db:3306/ozz
      DB_USER: root
      DB_PW: ${DB_PW:-ssafy}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-at-least-32-bytes}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-internal-token}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      FASTAPI_URL: http://ozz-ai:5000
      FILE_UPLOAD_DIR: /data/uploads
    volumes:
      - file-data:/data/uploads
    depends_on:
      - mysql-db
      - redis
      - rabbitmq
    networks:
      - spring-cloud-network
      - message-queue-network

  ozz-ai:
    container_name: ozz-ai
    build: ./ai
    ports:
      - "${AI_PORT:-5000}:5000"
    environment:
      AI_PORT: 5000
      RABBITMQ_HOST: rabbitmq
      CLOTHES_ENDPOINT: http://ozz-backend:8000
      FILE_HOST: http://ozz-backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-internal-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      IMAGE_PROCESS_MODE: ${IMAGE_PROCESS_MODE:-modal}
      MODAL_IMAGE_PROCESS_APP: ${MODAL_IMAGE_PROCESS_APP:-ozz-image-process}
      MODAL_IMAGE_PROCESS_FUNCTION: ${MODAL_IMAGE_PROCESS_FUNCTION:-process_image}
    depends_on:
      - ozz-backend
      - rabbitmq
    networks:
      - spring-cloud-network
      - message-queue-network

volumes:
  mysql-data:
  file-data:

networks:
  spring-cloud-network:
    driver: bridge
  message-queue-network:
    driver: bridge
