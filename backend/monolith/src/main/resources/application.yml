server:
  port: ${BACKEND_PORT:8000}

spring:
  application:
    name: ozz-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ozz?serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PW:ssafy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    database-platform: org.hibernate.dialect.MySQLDialect
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URLS:http://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:elastic}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:ssafy}
  data:
    elasticsearch:
      repositories:
        enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: /tmp
  mvc:
    static-path-pattern: /uploads/**
  web:
    resources:
      static-locations: file:${FILE_UPLOAD_DIR:/data/uploads}/
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PW:guest}
  cloud:
    stream:
      default-binder: rabbit

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:your-very-very-long-secret-key-that-is-at-least-32-bytes-long}
  expiration: 3600000

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/data/uploads}

fastapi:
  url: ${FASTAPI_URL:http://localhost:5000}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
  http-origin: ${FRONT_HTTP_HOST:http://localhost:3000}
  https-origin: ${FRONT_HTTPS_HOST:https://localhost:3000}

demo:
  account:
    email: ${DEMO_ACCOUNT_EMAIL:demo@ozz.local}
    name: ${DEMO_ACCOUNT_NAME:OZZ Demo}
    nickname: ${DEMO_ACCOUNT_NICKNAME:ozz-demo}
    birth: ${DEMO_ACCOUNT_BIRTH:2000-01-01}

internal:
  api-token: ${INTERNAL_API_TOKEN:}
