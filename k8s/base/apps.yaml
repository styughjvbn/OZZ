apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ozz-backend
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: ozz-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozz-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ozz-backend
  template:
    metadata:
      labels:
        app: ozz-backend
    spec:
      containers:
        - name: ozz-backend
          image: ozz/backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65 -XX:MaxMetaspaceSize=256m"
          envFrom:
            - configMapRef:
                name: ozz-config
            - secretRef:
                name: ozz-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: file-data
              mountPath: /data/uploads
      volumes:
        - name: file-data
          persistentVolumeClaim:
            claimName: file-data
---
apiVersion: v1
kind: Service
metadata:
  name: ozz-ai
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: ozz-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozz-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ozz-ai
  template:
    metadata:
      labels:
        app: ozz-ai
    spec:
      containers:
        - name: ozz-ai
          image: ozz/ai:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ozz-config
            - secretRef:
                name: ozz-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
