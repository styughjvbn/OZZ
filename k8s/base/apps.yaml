apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ozz-eureka
spec:
  ports:
    - name: http
      port: 8761
      targetPort: 8761
  selector:
    app: ozz-eureka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozz-eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ozz-eureka
  template:
    metadata:
      labels:
        app: ozz-eureka
    spec:
      containers:
        - name: ozz-eureka
          image: ozz/eureka:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=128m"
          envFrom:
            - configMapRef:
                name: ozz-config
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ozz-file
spec:
  ports:
    - name: http
      port: 9000
      targetPort: 9000
  selector:
    app: ozz-file
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozz-file
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ozz-file
  template:
    metadata:
      labels:
        app: ozz-file
    spec:
      containers:
        - name: ozz-file
          image: ozz/file-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=128m"
          envFrom:
            - configMapRef:
                name: ozz-config
            - secretRef:
                name: ozz-secret
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: file-data
              mountPath: /data/uploads
      volumes:
        - name: file-data
          persistentVolumeClaim:
            claimName: file-data
---
