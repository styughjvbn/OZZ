apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ozz
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: default
spec:
  ingressClassName: traefik
  rules:
    - host: ozz.sjw-project.site
      http:
        paths:
          - path: /api/demo-guest-login
            pathType: Prefix
            backend:
              service:
                name: ozz-frontend
                port:
                  number: 3000
          - path: /apis
            pathType: Prefix
            backend:
              service:
                name: ozz-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ozz-backend
                port:
                  number: 8000
          - path: /login/guest
            pathType: Prefix
            backend:
              service:
                name: ozz-backend
                port:
                  number: 8000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: ozz-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ozz-frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - ozz.sjw-project.site
