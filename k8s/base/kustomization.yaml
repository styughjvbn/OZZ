apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ozz

resources:
  - namespace.yaml
  - configmap.yaml
  - infra.yaml
  - apps.yaml
  - ingress.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false

images:
  - name: ozz/backend
    newTag: dev
  - name: ozz/ai
    newTag: dev
  - name: ozz/frontend
    newTag: dev
